    <button class="flex-1 bg-[#1f1f1f] rounded-full py-3 px-4 flex items-center justify-center gap-2 text-[14px] font-medium"><span>✦</span> Efeitos OIO</button>
    <button class="h-10 w-10 rounded-full bg-white text-black flex items-center justify-center">✕</button>
  </div>
</div>

<script>
let mode='foto';
let stream=null;
let facing='environment';
let recording=false;
let mediaRecorder=null;
let chunks=[];
let recTimer=null;
let recSeconds=0;
let flashOn=false;

async function initCam(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing, width:{ideal:1280}, height:{ideal:720}}, audio: mode!=='foto'});
    document.getElementById('cam').srcObject=stream;
  }catch(e){ console.log(e); }
}
initCam();

document.querySelectorAll('.modeBtn').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('.modeBtn').forEach(x=>{x.classList.remove('bg-white','text-black'); x.classList.add('opacity-50');});
    b.classList.add('bg-white','text-black'); b.classList.remove('opacity-50');
    if(b.dataset.mode==='live'){ b.classList.remove('bg-white','text-black'); b.classList.add('bg-[#ff0a4d]','text-white'); }
    mode=b.dataset.mode;
    updateUI();
    initCam();
  };
});

function updateUI(){
  const inner=document.getElementById('shutterInner');
  const live=document.getElementById('shutterLive');
  const liveBadge=document.getElementById('liveBadge');
  const vProg=document.getElementById('videoProgress');
  const vTimer=document.getElementById('videoTimer');
  if(mode==='foto'){ inner.classList.remove('hidden'); live.classList.add('hidden'); liveBadge.classList.add('hidden'); vProg.classList.add('hidden'); vTimer.classList.add('hidden'); inner.className='h-[64px] w-[64px] rounded-full bg-white'; }
  if(mode==='video'){ inner.classList.remove('hidden'); live.classList.add('hidden'); liveBadge.classList.add('hidden'); vProg.classList.remove('hidden'); vTimer.classList.remove('hidden'); inner.className='h-8 w-8 rounded-[6px] bg-[#ff0a4d]'; }
  if(mode==='live'){ inner.classList.add('hidden'); live.classList.remove('hidden'); liveBadge.classList.remove('hidden'); vProg.classList.add('hidden'); vTimer.classList.add('hidden'); }
}

document.getElementById('flipBtn').onclick=()=>{ facing=facing==='environment'?'user':'environment'; initCam(); };
document.getElementById('flashBtn').onclick=()=>{
  flashOn=!flashOn;
  if(stream){
    const track=stream.getVideoTracks()[0];
    try{ track.applyConstraints({advanced:[{torch:flashOn}]}); }catch(e){}
  }
  document.getElementById('flashBtn').style.opacity=flashOn?'1':'0.6';
};

document.getElementById('shutter').onclick=()=>{
  if(mode==='foto') takePhoto();
  if(mode==='video'){
    if(!recording) startVideo30();
    else stopVideo30();
  }
  if(mode==='live'){
    if(!recording) startLive();
    else stopLive();
  }
};

function takePhoto(){
  const v=document.getElementById('cam');
  const c=document.getElementById('canvas');
  c.width=v.videoWidth; c.height=v.videoHeight;
  c.getContext('2d').drawImage(v,0,0);
  const data=c.toDataURL('image/png');
  showPreview(data,false);
  addToGallery(data,false);
}

function startVideo30(){
  if(!stream) return;
  chunks=[]; recSeconds=0;
  mediaRecorder=new MediaRecorder(stream);
  mediaRecorder.ondataavailable=e=>{ if(e.data.size>0) chunks.push(e.data); };
  mediaRecorder.onstop=()=>{
    const blob=new Blob(chunks,{type:'video/mp4'});
    const url=URL.createObjectURL(blob);
    showPreview(url,true);
    addToGallery(url,true);
  };
  mediaRecorder.start();
  recording=true;
  document.getElementById('shutterInner').className='h-7 w-7 rounded-full bg-[#ff0a4d] rec';
  recTimer=setInterval(()=>{
    recSeconds++;
    document.getElementById('timerText').textContent=`00:${String(recSeconds).padStart(2,'0')}`;
    document.getElementById('progressBar').style.width=`${(recSeconds/30)*100}%`;
    if(recSeconds>=30) stopVideo30();
  },1000);
}

function stopVideo30(){
  if(mediaRecorder && mediaRecorder.state!=='inactive') mediaRecorder.stop();
  recording=false;
  clearInterval(recTimer);
  document.getElementById('shutterInner').className='h-8 w-8 rounded-[6px] bg-[#ff0a4d]';
  document.getElementById('timerText').textContent='00:00';
  document.getElementById('progressBar').style.width='0%';
  recSeconds=0;
}

let liveInterval=null;
function startLive(){
  recording=true;
  document.getElementById('shutterLive').textContent='●';
  document.getElementById('shutterLive').classList.add('rec');
  let viewers=1200;
  liveInterval=setInterval(()=>{
    viewers+=Math.floor(Math.random()*10-3);
    document.getElementById('viewers').textContent=(viewers/1000).toFixed(1)+'K';
  },1000);
}
function stopLive(){
  recording=false;
  document.getElementById('shutterLive').textContent='LIVE';
  document.getElementById('shutterLive').classList.remove('rec');
  clearInterval(liveInterval);
  alert('Live OIO encerrada!');
}

function showPreview(src,isVideo){
  const p=document.getElementById('preview');
  p.classList.remove('hidden');
  if(isVideo){
    document.getElementById('previewImg').classList.add('hidden');
    const v=document.getElementById('previewVideo');
    v.classList.remove('hidden'); v.src=src;
    document.getElementById('downloadBtn').href=src;
    document.getElementById('downloadBtn').download='oio-video-30s.mp4';
  }else{
    document.getElementById('previewVideo').classList.add('hidden');
    document.getElementById('previewImg').classList.remove('hidden');
    document.getElementById('previewImg').src=src;
    document.getElementById('downloadBtn').href=src;
    document.getElementById('downloadBtn').download='oio-foto.png';
  }
}
function closePreview(){ document.getElementById('preview').classList.add('hidden'); }

function addToGallery(src,isVideo){
  const strip=document.getElementById('galleryStrip');
  const div=document.createElement('div');
  div.className='min-w-[52px] h-[68px] rounded-[10px] bg-white/10 overflow-hidden relative';
  if(isVideo) div.innerHTML=`<video src="${src}" class="h-full w-full object-cover"></video><span class="absolute bottom-0 left-0 right-0 bg-black/60 text-[8px] text-center">30s</span>`;
  else div.innerHTML=`<img src="${src}" class="h-full w-full object-cover"/>`;
  strip.appendChild(div);
  document.getElementById('lastThumb').src=src;
}
</script>
</body>
</html>
