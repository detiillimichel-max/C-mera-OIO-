<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>OIO — Câmera</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  #video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
  #preview{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:none}
  .top{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:0;right:0;display:flex;justify-content:space-between;padding:0 16px;z-index:10}
  .btn{background:rgba(0,0,0,.45);border:none;color:#fff;width:44px;height:44px;border-radius:50%;font-size:22px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px)}
  .bottom{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 24px);left:0;right:0;display:flex;justify-content:center;align-items:center;gap:36px;z-index:10}
  #shutter{width:78px;height:78px;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,.35);transition:transform .1s}
  #shutter.recording{background:#ef4444;transform:scale(.9)}
  #timer{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translateX(-50%);background:#ef4444;color:#fff;padding:6px 14px;border-radius:20px;font-weight:600;font-size:14px;display:none;z-index:11}
  #modeToggle{display:flex;gap:4px;background:rgba(0,0,0,.4);border-radius:20px;padding:4px;position:fixed;top:calc(env(safe-area-inset-top) + 70px);left:50%;transform:translateX(-50%);z-index:10}
  #modeToggle button{background:transparent;border:none;color:#fff;padding:6px 14px;border-radius:16px;font-size:13px;font-weight:600}
  #modeToggle button.active{background:#fff;color:#000}
  #actions{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;flex-direction:column;justify-content:flex-end;z-index:20;backdrop-filter:blur(10px)}
  .sheet{background:#111;border-radius:24px 24px 0 0;padding:24px 20px calc(env(safe-area-inset-bottom) + 24px)}
  .sheet h3{font-size:18px;margin-bottom:16px;text-align:center}
  .actBtn{width:100%;padding:16px;border-radius:14px;border:none;font-size:16px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:10px}
  .primary{background:#25d366;color:#000}
  .secondary{background:#333;color:#fff}
  .cancel{background:transparent;color:#888}
  #titleInput{width:100%;padding:14px;border-radius:12px;border:1px solid #333;background:#1a1a1a;color:#fff;font-size:15px;margin-bottom:12px;display:none}
  .toast{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:12px 20px;border-radius:24px;font-size:14px;z-index:99;opacity:0;transition:opacity .3s}
  .toast.show{opacity:1}
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<img id="preview" alt="">

<div id="timer">● 00:00</div>

<div class="top">
  <button class="btn" id="close">✕</button>
  <button class="btn" id="flip">⟳</button>
</div>

<div id="modeToggle">
  <button data-mode="photo" class="active">Foto</button>
  <button data-mode="video">Vídeo 30s</button>
</div>

<div class="bottom">
  <button id="shutter" aria-label="Capturar"></button>
</div>

<div id="actions">
  <div class="sheet">
    <h3 id="sheetTitle">Enviar para o OIO</h3>
    <input id="titleInput" placeholder="Título do vídeo (opcional)" maxlength="80">
    <button class="actBtn primary" id="sendStory">📸 Postar no Story (24h)</button>
    <button class="actBtn secondary" id="sendVideo">🎬 Postar em Vídeos</button>
    <button class="actBtn cancel" id="cancelSend">Descartar</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============ Config OIO ============
const OIO_URL = "https://oio-fam.lovable.app";
const SHARE_TARGET = OIO_URL + "/share-target";

// ============ Estado ============
let stream = null;
let facing = "user";
let mode = "photo";
let mediaRecorder = null;
let recordedChunks = [];
let capturedBlob = null;
let capturedType = null; // "image" | "video"
let timerInterval = null;

const $video = document.getElementById("video");
const $preview = document.getElementById("preview");
const $shutter = document.getElementById("shutter");
const $flip = document.getElementById("flip");
const $close = document.getElementById("close");
const $timer = document.getElementById("timer");
const $actions = document.getElementById("actions");
const $titleInput = document.getElementById("titleInput");
const $sheetTitle = document.getElementById("sheetTitle");
const $toast = document.getElementById("toast");

function toast(msg){
  $toast.textContent = msg;
  $toast.classList.add("show");
  setTimeout(()=>$toast.classList.remove("show"), 2400);
}

// ============ Câmera ============
async function startCamera(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:facing, width:{ideal:1920}, height:{ideal:1080}},
      audio: mode === "video"
    });
    $video.srcObject = stream;
    $video.style.display = "block";
    $preview.style.display = "none";
  }catch(e){
    toast("Não foi possível abrir a câmera");
    console.error(e);
  }
}

$flip.onclick = ()=>{ facing = facing==="user"?"environment":"user"; startCamera(); };
$close.onclick = ()=>{ if(stream) stream.getTracks().forEach(t=>t.stop()); window.close(); location.href="about:blank"; };

// ============ Modo Foto/Vídeo ============
document.querySelectorAll("#modeToggle button").forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll("#modeToggle button").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    mode = b.dataset.mode;
    startCamera();
  };
});

// ============ Captura ============
$shutter.onclick = async ()=>{
  if(mode === "photo"){
    capturePhoto();
  }else{
    if(mediaRecorder && mediaRecorder.state === "recording"){
      stopRecording();
    }else{
      startRecording();
    }
  }
};

function capturePhoto(){
  const c = document.createElement("canvas");
  c.width = $video.videoWidth; c.height = $video.videoHeight;
  const ctx = c.getContext("2d");
  if(facing === "user"){ ctx.translate(c.width,0); ctx.scale(-1,1); }
  ctx.drawImage($video, 0, 0, c.width, c.height);
  c.toBlob((blob)=>{
    capturedBlob = blob;
    capturedType = "image";
    $preview.src = URL.createObjectURL(blob);
    $preview.style.display = "block";
    $video.style.display = "none";
    openActions();
  }, "image/jpeg", 0.92);
}

function startRecording(){
  recordedChunks = [];
  const mime = MediaRecorder.isTypeSupported("video/mp4") ? "video/mp4" : "video/webm;codecs=vp9,opus";
  mediaRecorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 2_500_000 });
  mediaRecorder.ondataavailable = e => e.data.size && recordedChunks.push(e.data);
  mediaRecorder.onstop = ()=>{
    const blob = new Blob(recordedChunks, { type: mime });
    capturedBlob = blob;
    capturedType = "video";
    openActions();
  };
  mediaRecorder.start(250);
  $shutter.classList.add("recording");
  $timer.style.display = "block";
  const t0 = Date.now();
  timerInterval = setInterval(()=>{
    const s = Math.floor((Date.now()-t0)/1000);
    $timer.textContent = "● " + String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0");
    if(s >= 30) stopRecording();
  }, 200);
}

function stopRecording(){
  if(mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
  clearInterval(timerInterval);
  $timer.style.display = "none";
  $shutter.classList.remove("recording");
}

// ============ Enviar para o OIO ============
function openActions(){
  $sheetTitle.textContent = capturedType === "video" ? "Enviar vídeo para o OIO" : "Enviar foto para o OIO";
  $titleInput.style.display = capturedType === "video" ? "block" : "none";
  $titleInput.value = "";
  $actions.style.display = "flex";
}
function closeActions(){ $actions.style.display = "none"; startCamera(); }

document.getElementById("cancelSend").onclick = closeActions;

async function sendToOIO(destino){
  if(!capturedBlob) return;
  const ext = capturedType === "video" ? (capturedBlob.type.includes("mp4") ? "mp4":"webm") : "jpg";
  const filename = `oio-${Date.now()}.${ext}`;
  const file = new File([capturedBlob], filename, { type: capturedBlob.type });
  const titulo = $titleInput.value.trim();

  // Tenta compartilhar arquivo real (Android Chrome / iOS 15+)
  if(navigator.canShare && navigator.canShare({ files:[file] })){
    try{
      await navigator.share({
        files:[file],
        title: destino === "story" ? "Story OIO" : "Vídeo OIO",
        text: `${destino === "story" ? "[STORY]" : "[VIDEO]"} ${titulo}`.trim(),
      });
      toast("Enviado! Escolha o OIO na lista.");
      setTimeout(closeActions, 800);
      return;
    }catch(e){ if(e.name === "AbortError") return; console.warn(e); }
  }

  // Fallback: abre o OIO com metadados via GET (sem o arquivo — usuário anexa lá)
  const params = new URLSearchParams({
    title: destino === "story" ? "Story da Câmera OIO" : (titulo || "Vídeo da Câmera OIO"),
    text: `[${destino.toUpperCase()}] Enviado da Câmera OIO`,
    url: OIO_URL + (destino === "story" ? "/?abrir=story" : "/videos?abrir=upload"),
  });
  window.location.href = SHARE_TARGET + "?" + params.toString();
}

document.getElementById("sendStory").onclick = ()=> sendToOIO("story");
document.getElementById("sendVideo").onclick = ()=> sendToOIO("video");

// ============ Bootstrap ============
startCamera();
document.addEventListener("visibilitychange", ()=>{
  if(document.hidden && mediaRecorder?.state === "recording") stopRecording();
});
</script>
</body>
</html>
